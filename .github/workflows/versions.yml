name: Desktop versions

# Builds unsigned macOS (arm64 + x64) and Windows x64 packages for every
# upstream `dsh-v*` tag. Scheduled runs only build tags newer than the newest
# existing release; manual dispatch can backfill older tags.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Build every missing upstream tag instead of only tags newer than the newest release'
        type: boolean
        default: false
      max_tags:
        description: 'Maximum tags to build in one run (0 = no limit)'
        type: string
        default: '3'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: desktop-versions
  cancel-in-progress: false

env:
  UPSTREAM: deepseek-ai/deepseek-harness
  GH_REPO: ${{ github.repository }}
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_UPDATE_CHANNEL: latest

jobs:
  discover:
    name: Find unpublished upstream tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has: ${{ steps.plan.outputs.has }}
      matrix: ${{ steps.plan.outputs.matrix }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL: ${{ inputs.backfill }}
          MAX_TAGS: ${{ inputs.max_tags }}
        run: node scripts/plan-versions.mjs

  build:
    name: Package ${{ matrix.version }} · ${{ matrix.platform }}
    needs: discover
    if: needs.discover.outputs.has == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.tag }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare unsigned Windows packaging settings
        if: matrix.platform == 'win-x64'
        shell: pwsh
        run: |
          @"
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://www.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://www.deepseek.com"]}
          "@ | Set-Content -Encoding utf8 apps/desktop/.env.windows
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package unsigned installer
        run: pnpm run ${{ matrix.script }}
      - name: Verify the checked-out tag matches the planned version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "${{ matrix.version }}" ]; then
            echo "package.json version $version does not match tag ${{ matrix.tag }}" >&2
            exit 1
          fi
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: version-${{ matrix.tag }}-${{ matrix.platform }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.platform }}/unsigned-artifacts/**/deepseek-harness-*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.platform }}/unsigned-artifacts/**/deepseek-harness-*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Release ${{ matrix.version }}
    needs: [discover, build]
    if: needs.discover.outputs.has == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.tags) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: version-${{ matrix.tag }}-*
          merge-multiple: true
          path: dist
      - name: Create the version release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ matrix.sha }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          files=$(find dist -type f -name 'deepseek-harness-*' \( -name '*.dmg' -o -name '*.exe' \) | sort)
          test -n "$files"
          built=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          meta=$(node -e 'console.log(JSON.stringify({channel:"version",version:process.argv[1],sha:process.argv[2],builtAt:process.argv[3]}))' "$VERSION" "$SHA" "$built")
          {
            echo "<!-- dsh-build: $meta -->"
            echo
            echo "Unsigned macOS (arm64, x64) and Windows (x64) builds of upstream tag \`$TAG\`."
            echo
            echo "These are unofficial builds. macOS quarantines unsigned downloads; after copying the app to \`/Applications\`, run:"
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"'
            echo '```'
            echo
            echo 'Windows shows a SmartScreen warning; choose "More info" then "Run anyway".'
          } > release.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Version $VERSION" --notes-file release.md
          else
            gh release create "$TAG" --title "Version $VERSION" --notes-file release.md
          fi
          printf '%s\n' "$files" | xargs -d '\n' -r gh release upload "$TAG" --clobber

  site:
    name: Refresh download site
    needs: [discover, build, publish]
    if: needs.discover.outputs.has == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate download manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-manifest.mjs > site/data/builds.json
      - name: Snapshot release changelogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-changelogs.mjs > site/data/changelogs.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
