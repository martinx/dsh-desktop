name: Desktop nightly

# Tracks upstream master, builds unsigned macOS (arm64 + x64) and Windows x64
# packages on GitHub-hosted runners, publishes them to the rolling `nightly`
# release, and refreshes the download site.
#
# Unsigned packaging needs no machine preset, signing identity, or COS
# credentials. The Windows unsigned mode still reads apps/desktop/.env.windows
# for policy origins, which this workflow generates.
on:
  schedule:
    # Hourly. Most runs stop after the resolve job when upstream has not moved.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even when upstream master has not moved'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: desktop-nightly
  cancel-in-progress: false

env:
  UPSTREAM: deepseek-ai/deepseek-harness
  GH_REPO: ${{ github.repository }}
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_UPDATE_CHANNEL: nightly

jobs:
  resolve:
    name: Resolve upstream master
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.upstream.outputs.sha }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: Read upstream master
        id: upstream
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/$UPSTREAM.git" refs/heads/master | cut -f1)
          test -n "$sha"
          version=$(curl -fsSL "https://raw.githubusercontent.com/$UPSTREAM/$sha/package.json" \
            | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          test -n "$version"
          {
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - name: Skip when this commit is already published
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.upstream.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          body=$(gh release view nightly --json body --jq '.body' 2>/dev/null || true)
          built=$(printf '%s' "$body" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk })
            process.stdin.on("end", () => {
              const match = /dsh-build:\s*(\{[^}]*\})/u.exec(input)
              if (!match) return
              try { process.stdout.write(JSON.parse(match[1]).sha ?? "") } catch {}
            })')
          if [ "$FORCE" = 'true' ] || [ "$built" != "$SHA" ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo "already published $SHA" >> "$GITHUB_STEP_SUMMARY"
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Package ${{ matrix.platform }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-14
            script: package:desktop:mac:arm64:unsigned
          - platform: win-x64
            runner: windows-latest
            script: package:desktop:win:x64:unsigned
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Prepare unsigned Windows packaging settings
        if: matrix.platform == 'win-x64'
        shell: pwsh
        run: |
          @"
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://www.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://www.deepseek.com"]}
          "@ | Set-Content -Encoding utf8 apps/desktop/.env.windows
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package unsigned installer
        run: pnpm run ${{ matrix.script }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.platform }}/unsigned-artifacts/**/deepseek-harness-*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.platform }}/unsigned-artifacts/**/deepseek-harness-*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish nightly release and site
    needs: [resolve, build]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist
      - name: Update the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          built=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          meta=$(node -e 'console.log(JSON.stringify({channel:"nightly",version:process.argv[1],sha:process.argv[2],builtAt:process.argv[3]}))' "$VERSION" "$SHA" "$built")
          {
            echo "<!-- dsh-build: $meta -->"
            echo
            echo "Unsigned macOS (arm64, x64) and Windows (x64) builds of upstream \`$SHA\` at version \`$VERSION\`."
            echo
            echo "These are unofficial builds. macOS quarantines unsigned downloads; after copying the app to \`/Applications\`, run:"
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness.app"'
            echo '```'
            echo
            echo 'Windows shows a SmartScreen warning; choose "More info" then "Run anyway".'
          } > release.md
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly · $VERSION" --notes-file release.md
          else
            gh release create nightly --prerelease --title "Nightly · $VERSION" --notes-file release.md
          fi
          find dist -type f -name 'deepseek-harness-*' \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | xargs -0 -r gh release upload nightly --clobber
      - name: Regenerate download manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-manifest.mjs > site/data/builds.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
